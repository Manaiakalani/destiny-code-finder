# Dependabot configuration - auto-generated
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # typescript-eslint 8.x peers `typescript@>=4.8.4 <6.1.0`. TypeScript 7.0
    # has no compiler API (support is expected with 7.1). Drop this ignore
    # once typescript-eslint documents 7.x support.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
